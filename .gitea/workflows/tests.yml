# versioner's own CI. The repo had none, so nothing verified the tool that
# verifies everyone else.

name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Configure git identity for the test fixtures
        run: |
          git config --global user.name "versioner-ci"
          git config --global user.email "versioner@ci"

      - name: Run the suite (unit + e2e + shellcheck)
        run: ./tests/run.sh

  lint-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # versioner lints its own history with itself
      - name: Lint the PR's commits
        run: ./ci/pr-gate.sh
