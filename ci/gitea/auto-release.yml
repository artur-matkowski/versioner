# versioner — Gitea Actions: automatic release on the production branch
#
# Copy to <parent repo>/.gitea/workflows/versioner-auto-release.yml, or let
# `./versioner/bin/versioner init` write it for you.
#
# This file is a thin trigger on purpose: the logic lives in the submodule at
# versioner/ci/release.sh, so `git submodule update --remote` picks up fixes
# without editing anything in the parent repo.
#
# On every push to release/production:
#   1. computes the version (fold of the whole history)
#   2. if it changed: regenerates CHANGELOG.md, commits "chore(release): vX.Y.Z",
#      creates an annotated tag vX.Y.Z, pushes branch + tag
#   3. if unchanged: no-op (idempotent, race-safe)
#
# Needs a token with write access. Gitea Actions usually provides GITEA_TOKEN;
# otherwise create a repo token (write: contents) and add it as that secret.
# Keep the branch filter in sync with `production_branches` in your policy.

name: versioner: auto-release

on:
  push:
    branches: [release/production]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GITEA_TOKEN }}

      - name: Release (changelog + commit + tag + push)
        run: ./versioner/ci/release.sh
