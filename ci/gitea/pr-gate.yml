# versioner — Gitea Actions: PR gate
#
# Copy to <parent repo>/.gitea/workflows/versioner-pr-gate.yml, or let
# `./versioner/bin/versioner init` write it for you.
#
# This file is a thin trigger on purpose: the logic lives in the submodule at
# versioner/ci/pr-gate.sh, so `git submodule update --remote` picks up fixes
# without editing anything in the parent repo.
#
# Validates ONLY the commits added by the PR (merge-base..HEAD), so a repo that
# adopts versioner mid-history is never blocked by legacy commits.

name: versioner: PR gate

on:
  pull_request:

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Lint PR commits
        # Set VERSIONER_BASE_BRANCH only if your Gitea does not export a PR base ref.
        run: ./versioner/ci/pr-gate.sh
