# versioner — Gitea Actions: PR gate
#
# Copy to <parent repo>/.gitea/workflows/versioner-pr-gate.yml
# Requires: versioner checked out as a submodule at ./versioner
# (gitea/act_runner with `submodules: true` support, or a manual
# `git submodule update --init` step).
#
# Validates ONLY the commits added by the PR (merge-base..HEAD), so a repo
# that adopts versioner mid-history is never blocked by legacy commits.

name: versioner: PR gate

on:
  pull_request:

env:
  # Adjust to your default branch.
  VERSIONER_BASE_BRANCH: main

jobs:
  lint-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Lint PR commits
        run: |
          set -euo pipefail
          BASE="origin/${VERSIONER_BASE_BRANCH}"
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || git fetch origin "${VERSIONER_BASE_BRANCH}"
          ./versioner/bin/versioner lint-range "$BASE" HEAD
