# Bump mapping: bump.<type>=<major|minor|patch|noop>
# A breaking commit (type! or BREAKING CHANGE footer) uses bump.breaking.
# Later definitions (including external-overrides) win.
bump.breaking=major
bump.feat=minor
bump.fix=patch
bump.perf=noop
bump.refactor=noop
bump.chore=noop
bump.docs=noop
bump.test=noop
bump.style=noop
bump.ci=noop
