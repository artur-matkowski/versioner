# Extended regexes matched against commit subjects; matching commits are
# skipped by the commit-msg hook and lint-range, and ignored by the version
# fold / changelog.
#
# Each `ignore_re=<ere>` line appends to the list. A bare `ignore_re=` (empty
# value) resets the list, so an override file can drop these defaults.
ignore_re=^Merge
ignore_re=^chore\(release\):
ignore_re=^Revert
